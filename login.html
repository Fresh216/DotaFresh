<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход | DOTA SERVICE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(8, 8, 12, 0.90),
                    rgba(8, 8, 12, 0.96)
                ),
                url("https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/social/invoker.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;

            display: flex;
            flex-direction: column;
        }


        /* ========================= */
        /* ШАПКА */
        /* ========================= */

        header {
            height: 75px;
            padding: 0 9%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(18, 19, 26, 0.96);
            border-bottom: 1px solid #292b35;
        }


        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo span {
            color: #f05243;
        }


        .home-button {
            color: #aaa;
            text-decoration: none;

            padding: 10px 18px;

            border: 1px solid #343641;
            border-radius: 8px;

            transition: 0.3s;
        }

        .home-button:hover {
            color: white;
            border-color: #f05243;
        }


        /* ========================= */
        /* ОСНОВНАЯ ЧАСТЬ */
        /* ========================= */

        main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }


        /* ========================= */
        /* ОКНО ВХОДА */
        /* ========================= */

        .login-box {
            width: 100%;
            max-width: 500px;

            padding: 45px;

            background: rgba(24, 25, 34, 0.97);

            border: 1px solid #343641;
            border-radius: 18px;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.65);
        }


        .small-title {
            color: #f05243;

            font-size: 12px;
            letter-spacing: 4px;

            margin-bottom: 15px;
        }


        h1 {
            margin: 0 0 10px;
            font-size: 38px;
        }


        .description {
            color: #999;
            line-height: 1.6;
            margin-bottom: 30px;
        }


        /* ========================= */
        /* СООБЩЕНИЯ */
        /* ========================= */

        .message {
            padding: 14px 16px;
            margin-bottom: 20px;

            background: rgba(240, 82, 67, 0.12);

            border: 1px solid rgba(240, 82, 67, 0.45);

            border-radius: 8px;

            color: #ff8a7f;
        }


        /* ========================= */
        /* ФОРМА */
        /* ========================= */

        form {
            width: 100%;
        }


        label {
            display: block;

            margin-bottom: 8px;
            margin-top: 18px;

            color: #c7c7c7;

            font-size: 14px;
        }


        input {
            width: 100%;

            padding: 14px 16px;

            background: #111219;

            border: 1px solid #343641;
            border-radius: 8px;

            color: white;

            font-size: 15px;

            transition: 0.25s;
        }


        input::placeholder {
            color: #666a78;
        }


        input:focus {
            outline: none;

            border-color: #f05243;

            box-shadow:
                0 0 0 3px rgba(240, 82, 67, 0.12);
        }


        /* ========================= */
        /* ПОЛЕ ПАРОЛЯ */
        /* ========================= */

        .password-box {
            position: relative;
            width: 100%;
        }


        .password-box input {
            padding-right: 55px;
        }


        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;

            border: none;

            color: #a0a4b8;

            font-size: 19px;

            cursor: pointer;

            border-radius: 8px;

            transition: 0.25s;
        }


        .show-password:hover {
            color: white;

            background: rgba(255, 255, 255, 0.06);
        }


        /* ========================= */
        /* КНОПКА ВХОДА */
        /* ========================= */

        .login-button {
            width: 100%;

            margin-top: 28px;

            padding: 15px;

            border: none;
            border-radius: 8px;

            background: #f05243;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-button:hover {
            background: #ff6252;

            transform: translateY(-2px);
        }


        /* ========================= */
        /* РЕГИСТРАЦИЯ */
        /* ========================= */

        .register-text {
            margin-top: 25px;

            text-align: center;

            color: #888;
        }


        .register-text a {
            color: #f05243;

            text-decoration: none;

            font-weight: bold;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        /* ========================= */
        /* АВТОЗАПОЛНЕНИЕ БРАУЗЕРА */
        /* ========================= */

        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-text-fill-color: white !important;

            -webkit-box-shadow:
                0 0 0 1000px #111219 inset !important;

            box-shadow:
                0 0 0 1000px #111219 inset !important;

            border: 1px solid #343641 !important;

            caret-color: white;

            transition:
                background-color 99999s ease-in-out 0s;
        }


        /* ========================= */
        /* ТЕЛЕФОН */
        /* ========================= */

        @media (max-width: 600px) {

            header {
                padding: 0 20px;
            }

            .login-box {
                padding: 30px 22px;
            }

            h1 {
                font-size: 30px;
            }

            main {
                padding: 30px 15px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        DOTA<span>SERVICE</span>
    </div>

    <a
        href="{{ url_for('index') }}"
        class="home-button"
    >
        ← На главную
    </a>

</header>


<main>

    <div class="login-box">

        <div class="small-title">
            ВХОД В АККАУНТ
        </div>

        <h1>
            С возвращением!
        </h1>

        <p class="description">
            Введите свои данные, чтобы войти в аккаунт DOTA SERVICE.
        </p>


        <!-- СООБЩЕНИЯ ОТ FLASK -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- ФОРМА ВХОДА -->

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >


            <!-- НИК -->

            <label>
                Имя пользователя
            </label>

            <input
                type="text"
                name="username"
                value="{{ username or '' }}"
                placeholder="Введите ваш ник"
                autocomplete="username"
                required
            >


            <!-- ПАРОЛЬ -->

            <label>
                Пароль
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()"
                    title="Показать пароль"
                >
                    👁
                </button>

            </div>


            <!-- КНОПКА -->

            <button
                type="submit"
                class="login-button"
            >
                Войти в аккаунт
            </button>


        </form>


        <!-- ССЫЛКА НА РЕГИСТРАЦИЮ -->

        <div class="register-text">

            Ещё нет аккаунта?

            <a href="{{ url_for('register') }}">
                Создать аккаунт
            </a>

        </div>

    </div>

</main>


<script>

    function togglePassword() {

        const password = document.getElementById("password");

        if (password.type === "password") {

            password.type = "text";

        } else {

            password.type = "password";

        }

    }

</script>


</body>

</html>
